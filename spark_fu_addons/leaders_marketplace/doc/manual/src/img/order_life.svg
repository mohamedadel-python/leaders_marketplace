<rect x="10" y="330" width="1080" height="34" rx="8" fill="#f3ecf1"/>
<text x="1080" y="352" font-size="13" fill="#4d3246" text-anchor="start" direction="rtl">في وضع FBM فقط بدون مستودع للسوق تبقى الخطوات كما هي: كل بائع يشحن من مخزنه ويبلغ عن التسليم.</text>
<text x="1090" y="395" font-size="15" fill="#b45f06" text-anchor="start" direction="rtl" font-weight="700">المسارات الجانبية عن الرحلة الأساسية</text>
<rect x="832" y="410" width="258" height="150" rx="10" fill="#fff8ee" stroke="#b45f06" stroke-width="2"/>
<text x="961.0" y="440" font-size="16" fill="#8a4a05" text-anchor="middle" direction="rtl" font-weight="700">إلغاء</text>
<text x="961.0" y="472" font-size="13" fill="#3a2a10" text-anchor="middle" direction="rtl">قبل الشحن: العميل أو البائع أو المنصة</text>
<text x="961.0" y="494" font-size="13" fill="#3a2a10" text-anchor="middle" direction="rtl">يعكس قيد الأمانة ويجهز الاسترداد</text>
<text x="961.0" y="516" font-size="13" fill="#3a2a10" text-anchor="middle" direction="rtl">بعد شحن جزئي: إلغاء المتبقي</text>
<rect x="891.0" y="528" width="140" height="24" rx="12" fill="#b45f06"/>
<text x="961.0" y="545" font-size="12" fill="#fff" text-anchor="middle" direction="rtl" font-weight="700">من الخطوة 3 إلى 5</text>
<rect x="558" y="410" width="258" height="150" rx="10" fill="#fff8ee" stroke="#b45f06" stroke-width="2"/>
<text x="687.0" y="440" font-size="16" fill="#8a4a05" text-anchor="middle" direction="rtl" font-weight="700">مرتجع واستبدال واسترداد</text>
<text x="687.0" y="472" font-size="13" fill="#3a2a10" text-anchor="middle" direction="rtl">بعد التسليم وخلال مهلة المرتجع</text>
<text x="687.0" y="494" font-size="13" fill="#3a2a10" text-anchor="middle" direction="rtl">موافقة البائع أو قرار السوق</text>
<text x="687.0" y="516" font-size="13" fill="#3a2a10" text-anchor="middle" direction="rtl">استلام البضاعة ثم استرداد أو بدل</text>
<rect x="617.0" y="528" width="140" height="24" rx="12" fill="#b45f06"/>
<text x="687.0" y="545" font-size="12" fill="#fff" text-anchor="middle" direction="rtl" font-weight="700">بعد الخطوة 6</text>
<rect x="284" y="410" width="258" height="150" rx="10" fill="#fff8ee" stroke="#b45f06" stroke-width="2"/>
<text x="413.0" y="440" font-size="16" fill="#8a4a05" text-anchor="middle" direction="rtl" font-weight="700">نزاع</text>
<text x="413.0" y="472" font-size="13" fill="#3a2a10" text-anchor="middle" direction="rtl">يفتحه العميل على الطلب</text>
<text x="413.0" y="494" font-size="13" fill="#3a2a10" text-anchor="middle" direction="rtl">البائع يرد ثم يصعد للسوق</text>
<text x="413.0" y="516" font-size="13" fill="#3a2a10" text-anchor="middle" direction="rtl">مراجع السوق يكتب القرار</text>
<rect x="343.0" y="528" width="140" height="24" rx="12" fill="#b45f06"/>
<text x="413.0" y="545" font-size="12" fill="#fff" text-anchor="middle" direction="rtl" font-weight="700">بعد الخطوة 5</text>
<rect x="10" y="410" width="258" height="150" rx="10" fill="#fff8ee" stroke="#b45f06" stroke-width="2"/>
<text x="139.0" y="440" font-size="16" fill="#8a4a05" text-anchor="middle" direction="rtl" font-weight="700">رفض الاستلام عند الباب</text>
<text x="139.0" y="472" font-size="13" fill="#3a2a10" text-anchor="middle" direction="rtl">للدفع عند الاستلام بعد الشحن</text>
<text x="139.0" y="494" font-size="13" fill="#3a2a10" text-anchor="middle" direction="rtl">يلغى الطلب وتعود البضاعة</text>
<text x="139.0" y="516" font-size="13" fill="#3a2a10" text-anchor="middle" direction="rtl">لا أرباح ويزيد عداد الرفض</text>
<rect x="69.0" y="528" width="140" height="24" rx="12" fill="#b45f06"/>
<text x="139.0" y="545" font-size="12" fill="#fff" text-anchor="middle" direction="rtl" font-weight="700">بين الخطوتين 5 و6</text>
<line x1="961.0" y1="560" x2="961.0" y2="560" />
<rect x="10" y="580" width="1080" height="160" rx="10" fill="#f3ecf1" stroke="#714B67" stroke-width="1.5"/>
<text x="1080" y="608" font-size="15" fill="#4d3246" text-anchor="start" direction="rtl" font-weight="700">أين المال في كل مرحلة؟</text>
<text x="1080" y="640" font-size="14" fill="#714B67" text-anchor="start" direction="rtl" font-weight="700">الخطوات 3 و4</text>
<text x="930" y="640" font-size="13" fill="#222" text-anchor="start" direction="rtl">المال عند المنصة في الأمانة ولا يظهر للبائع كرصيد.</text>
<text x="1080" y="667" font-size="14" fill="#714B67" text-anchor="start" direction="rtl" font-weight="700">الخطوتان 6 و7</text>
<text x="930" y="667" font-size="13" fill="#222" text-anchor="start" direction="rtl">تسجل الأرباح في المحفظة بحالة معلق مع احتجاز احتياطي المرتجعات إن فعل.</text>
<text x="1080" y="694" font-size="14" fill="#714B67" text-anchor="start" direction="rtl" font-weight="700">الخطوتان 8 و9</text>
<text x="930" y="694" font-size="13" fill="#222" text-anchor="start" direction="rtl">تصبح الحركة متاح ثم تجمع في تسوية تخصم منها العمولة.</text>
<text x="1080" y="721" font-size="14" fill="#714B67" text-anchor="start" direction="rtl" font-weight="700">الخطوتان 10 و11</text>
<text x="930" y="721" font-size="13" fill="#222" text-anchor="start" direction="rtl">بعد الاعتماد والصرف تصبح الحركات تمت التسوية.</text>
